# Plan Feature Flow
# Orchestrates feature planning with vault-first knowledge and checkpoint gate.

id: PLAN-flow
name: Plan Feature
description: >
  Feature planning workflow: search vault for prior art, brainstorm design
  approaches, then create a structured plan with a checkpoint gate for approval.
version: '1.0.0'
on-missing-capability:
  default: skip-with-warning
  blocking: [vault.search]

# WS5: strict input-scoping — each step receives only the context declared in
# its inputs: block. `advisory` would record the scoped bundle but deliver the
# full accumulated context; strict is the default and the point of the scoping.
enforcement: strict

triggers:
  modes:
    - PLAN
    - plan-iteration
  contexts:
    - feature
    - architecture
    - design
  min-confidence: MEDIUM

steps:
  - id: search-vault
    name: Search Vault Knowledge
    description: Search vault for patterns, anti-patterns, and previous plans related to the feature.
    needs: [vault.search, memory.search]
    chains:
      - vault-search
      - memory-search
    output:
      - vault-patterns
      - memory-hits

  - id: brainstorm
    name: Brainstorm Approaches
    description: Generate design approaches informed by vault knowledge and brain recommendations.
    needs: [brain.recommend, architecture.search]
    chains:
      - brain-recommend
      - architecture-search
    # Scoped inputs (WS5 stage-contract Inputs table): this step sees the
    # vault-patterns from search-vault plus a scoped vault query — nothing else.
    inputs:
      vault:
        - query: 'design approaches and architecture patterns'
          domain: architecture
          limit: 3
          mandatory: false
      from_steps:
        - search-vault.vault-patterns
    output:
      - brainstorm-options
      - architecture-guidance

  - id: create-plan
    name: Create Plan
    description: Produce a structured implementation plan and present it for approval.
    needs: [plan.create]
    chains:
      - plan-create
    # Scoped inputs: Layer 3 reference file (internalize) + Layer 4 working file
    # (process), plus the specific prior-step outputs this step depends on.
    inputs:
      files:
        - path: _config/voice.md # Layer 3 reference — internalize as constraint
          layer: 3
        - path: output/plan-notes.md # Layer 4 working artifact — process as input
          layer: 4
      from_steps:
        - search-vault.vault-patterns
        - brainstorm.brainstorm-options
        - brainstorm.architecture-guidance
    # Reference/working files may be absent in a given project — degrade
    # gracefully rather than halting the flow.
    on-missing-input: skip-with-warning
    output:
      - plan-document
      - plan-grade
    gate:
      type: CHECKPOINT
      condition: "grade >= 'B'"
      save:
        - plan-document
        - vault-patterns
      on-false:
        action: BRANCH
        goto: brainstorm
        message: 'Plan did not meet quality threshold. Re-brainstorm.'

on-error:
  default:
    action: STOP
    message: 'Planning flow encountered an error.'
  max-retries: 1

metadata:
  author: soleri
  domain: planning
  tags:
    - plan
    - architecture
    - vault-first
